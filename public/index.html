<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids9 - Portais de Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: var(--bg); margin: 0; font-family: var(--font-body); }
    .landing-card { background: var(--surface); padding: 40px; border-radius: 24px; text-align: center; max-width: 600px; width: 90%; border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
    .landing-card h1 { margin-bottom: 30px; font-size: 2.2rem; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 15px; font-family: var(--font-display); }
    .portal-links { display: flex; flex-direction: column; gap: 15px; }
    .portal-link { padding: 20px; background: var(--surface-alt); color: var(--ink); text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 1.1rem; border: 1px solid var(--line); transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; }
    .portal-link:hover { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 168, 150, 0.2); }
    .portal-link span:last-child { opacity: 0.5; font-size: 1.5rem; }
  </style>
</head>
<body>
  <div class="landing-card">
    <h1><span style="background:var(--primary); width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🧒</span> Kids9 System</h1>
    <p style="color: #9ca3af; margin-bottom: 30px;">Selecione o portal de acesso desejado para continuar.</p>
    
    <div class="portal-links">
      <a href="operator.html" class="portal-link">
        <span>📱 Acesso Operador (Check-in/out)</span>
        <span>→</span>
      </a>
      <a href="tv.html" class="portal-link">
        <span>📺 Painel TV Pública</span>
        <span>→</span>
      </a>
      <a href="admin.html" class="portal-link">
        <span>📊 Dashboard Administrativo</span>
        <span>→</span>
      </a>
    </div>
  </div>
</body>
</html>
